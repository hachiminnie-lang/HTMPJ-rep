<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1250 -1750 8700 13100" width="1160" height="1747" role="img" aria-labelledby="planTitle planDesc">
  <title id="planTitle">インダストリアルな1LDK 復元間取り図</title>
  <desc id="planDesc">写真5枚から推定した専有面積約56平方メートルの1LDK平面図。玄関土間、ウォークインクローゼット、モルタル床の寝室兼ワークスペース、洗面脱衣室、浴室、トイレ、Ⅱ型キッチンを含むLDK、バルコニーで構成される。</desc>

  <style id="plan-standalone-theme">
    :root{
      --w-board:#EDEBE4; --w-wall:#2A2823; --w-line:#55524A; --w-line-soft:#8C8880;
      --w-floor-wood:#DFCDB4; --w-floor-mortar:#CFCCC2; --w-floor-tile:#E2E1DA;
      --w-floor-bath:#DCE3E1; --w-balcony:#DAD8CF; --w-plank:#C9AF8E;
      --w-dim:#7A776D; --w-label:#23211C; --w-sub:#6E6B62; --w-accent:#3F6670;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --w-board:#1F1F1C; --w-wall:#E8E5DB; --w-line:#A5A196; --w-line-soft:#6E6B62;
        --w-floor-wood:#3B342B; --w-floor-mortar:#35342F; --w-floor-tile:#2C2C28;
        --w-floor-bath:#26302F; --w-balcony:#292824; --w-plank:#4A4034;
        --w-dim:#8A867B; --w-label:#EFEDE4; --w-sub:#A5A196; --w-accent:#86B7C2;
      }
    }
  </style>

  <style>
    .wall{ fill:var(--w-wall,#2A2823); }
    .fx{ fill:none; stroke:var(--w-line,#55524A); stroke-width:16; stroke-linejoin:round; }
    .fx-f{ fill:var(--w-board,#EDEBE4); stroke:var(--w-line,#55524A); stroke-width:16; stroke-linejoin:round; }
    .fx-d{ fill:none; stroke:var(--w-line-soft,#8C8880); stroke-width:14; stroke-dasharray:70 50; }
    .leaf{ fill:none; stroke:var(--w-line,#55524A); stroke-width:34; stroke-linecap:square; }
    .swing{ fill:none; stroke:var(--w-line-soft,#8C8880); stroke-width:12; }
    .glass{ fill:none; stroke:var(--w-line,#55524A); stroke-width:14; }
    .dimline{ fill:none; stroke:var(--w-dim,#7A776D); stroke-width:9; }
    .tick{ stroke:var(--w-dim,#7A776D); stroke-width:9; }

    .t{ font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",Arial,sans-serif; }
    .rname{ font-size:175px; font-weight:600; fill:var(--w-label,#23211C); letter-spacing:4px; }
    .rname-s{ font-size:140px; font-weight:600; fill:var(--w-label,#23211C); letter-spacing:3px; }
    .rsub{ font-size:120px; font-weight:400; fill:var(--w-sub,#6E6B62); letter-spacing:2px; }
    .note{ font-size:108px; font-weight:400; fill:var(--w-sub,#6E6B62); letter-spacing:1px; }
    .dimt{ font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
           font-size:124px; fill:var(--w-dim,#7A776D); letter-spacing:1px; }
    .dimt-b{ font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
             font-size:138px; font-weight:600; fill:var(--w-dim,#7A776D); letter-spacing:1px; }

    .cone{ fill:var(--w-accent,#3F6670); opacity:.15; }
    .camdot{ fill:var(--w-accent,#3F6670); }
    .camnum{ font-family:"Hiragino Sans","Yu Gothic",Arial,sans-serif; font-size:150px;
             font-weight:700; fill:var(--w-board,#EDEBE4); }
    .cam{ transition:opacity .25s ease; }
    .cam.dim{ opacity:.22; }
    @media (prefers-reduced-motion: reduce){ .cam{ transition:none; } }
  </style>

  <defs>
    <pattern id="plank" width="220" height="220" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="220" stroke="var(--w-plank,#C9AF8E)" stroke-width="9"/>
    </pattern>
    <pattern id="balhatch" width="150" height="150" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="150" stroke="var(--w-line-soft,#8C8880)" stroke-width="7" opacity=".45"/>
    </pattern>
    <path id="viewcone" d="M0 0 L-500 -866 A1000 1000 0 0 1 500 -866 Z"/>
  </defs>

  <rect x="-1250" y="-1750" width="8700" height="13100" fill="var(--w-board,#EDEBE4)"/>

  <!-- ============ バルコニー ============ -->
  <g>
    <rect x="-150" y="8750" width="6500" height="1350" fill="var(--w-balcony,#DAD8CF)"/>
    <rect x="-150" y="8750" width="6500" height="1350" fill="url(#balhatch)"/>
    <rect x="-150" y="10100" width="6500" height="120" class="wall"/>
    <rect x="-150" y="8750" width="120" height="1350" class="wall"/>
    <rect x="6230" y="8750" width="120" height="1350" class="wall"/>
    <!-- エアコン室外機 -->
    <rect x="4820" y="9200" width="820" height="380" class="fx-f"/>
    <circle cx="5230" cy="9390" r="120" class="fx"/>
  </g>

  <!-- ============ 床仕上げ ============ -->
  <g>
    <!-- ウォルナット無垢フローリング：ホール＋LDK＋WIC -->
    <g fill="var(--w-floor-wood,#DFCDB4)">
      <rect x="0" y="0" width="2000" height="1850"/>
      <rect x="2100" y="1650" width="2500" height="3900"/>
      <rect x="4600" y="3300" width="1600" height="2250"/>
      <rect x="0" y="5550" width="6200" height="3050"/>
    </g>
    <g fill="url(#plank)">
      <rect x="0" y="0" width="2000" height="1850"/>
      <rect x="2100" y="1650" width="2500" height="3900"/>
      <rect x="4600" y="3300" width="1600" height="2250"/>
      <rect x="0" y="5550" width="6200" height="3050"/>
    </g>
    <!-- モルタル：玄関土間・寝室 -->
    <rect x="2100" y="0" width="1500" height="1650" fill="var(--w-floor-mortar,#CFCCC2)"/>
    <rect x="0" y="1950" width="2700" height="3500" fill="var(--w-floor-mortar,#CFCCC2)"/>
    <!-- 水まわり -->
    <rect x="3700" y="0" width="800" height="1650" fill="var(--w-floor-tile,#E2E1DA)"/>
    <rect x="4600" y="1700" width="1600" height="1500" fill="var(--w-floor-tile,#E2E1DA)"/>
    <rect x="4600" y="0" width="1600" height="1600" fill="var(--w-floor-bath,#DCE3E1)"/>
  </g>

  <!-- ============ 造作・設備 ============ -->
  <g>
    <!-- 浴室 1616ユニットバス -->
    <rect x="4700" y="100" width="1400" height="700" rx="70" class="fx-f"/>
    <circle cx="4880" cy="1330" r="70" class="fx"/>

    <!-- 洗面脱衣室 -->
    <rect x="5420" y="1780" width="720" height="500" class="fx-f"/>
    <ellipse cx="5780" cy="2030" rx="200" ry="140" class="fx"/>
    <rect x="4680" y="1790" width="640" height="640" class="fx-f"/>
    <circle cx="5000" cy="2110" r="200" class="fx"/>
    <text class="t note" x="5000" y="2610" text-anchor="middle">洗濯機</text>

    <!-- トイレ -->
    <rect x="3930" y="120" width="340" height="190" class="fx-f"/>
    <ellipse cx="4100" cy="560" rx="180" ry="270" class="fx-f"/>

    <!-- 玄関：シューズラック（オープン棚）＋上がり框 -->
    <rect x="3250" y="150" width="350" height="1350" class="fx-d"/>
    <g class="fx-d">
      <line x1="3250" y1="487" x2="3600" y2="487"/>
      <line x1="3250" y1="825" x2="3600" y2="825"/>
      <line x1="3250" y1="1162" x2="3600" y2="1162"/>
    </g>
    <rect x="2100" y="1590" width="1500" height="60" class="wall"/>

    <!-- WIC：枕棚＋ハンガーパイプ＋可動棚 -->
    <line x1="110" y1="430" x2="1890" y2="430" class="fx-d"/>
    <line x1="110" y1="560" x2="1890" y2="560" class="fx"/>
    <rect x="1560" y="720" width="380" height="1030" class="fx-d"/>
    <line x1="1560" y1="1063" x2="1940" y2="1063" class="fx-d"/>
    <line x1="1560" y1="1406" x2="1940" y2="1406" class="fx-d"/>

    <!-- 寝室：ベッド／デスク／チェア／本棚／フック -->
    <rect x="120" y="3300" width="1200" height="1980" rx="45" class="fx-f"/>
    <rect x="160" y="3345" width="1120" height="400" rx="40" class="fx"/>
    <line x1="120" y1="4050" x2="1320" y2="4050" class="fx"/>
    <rect x="1950" y="2500" width="750" height="1500" class="fx-f"/>
    <rect x="2180" y="2760" width="520" height="120" class="fx"/>
    <circle cx="1680" cy="3090" r="270" class="fx-f"/>
    <rect x="2300" y="4400" width="400" height="900" class="fx-f"/>
    <line x1="2300" y1="4700" x2="2700" y2="4700" class="fx"/>
    <line x1="2300" y1="5000" x2="2700" y2="5000" class="fx"/>
    <g class="camdot">
      <circle cx="95" cy="2180" r="55"/><circle cx="95" cy="2420" r="55"/><circle cx="95" cy="2660" r="55"/>
    </g>

    <!-- キッチン Ⅱ型 -->
    <rect x="4300" y="3450" width="650" height="2550" class="fx-f"/>
    <rect x="4380" y="3700" width="490" height="620" rx="45" class="fx"/>
    <rect x="4320" y="4450" width="610" height="600" class="fx-d"/>
    <rect x="4380" y="5180" width="490" height="640" class="fx"/>
    <g class="fx">
      <circle cx="4500" cy="5340" r="90"/><circle cx="4750" cy="5340" r="90"/>
      <circle cx="4500" cy="5650" r="90"/><circle cx="4750" cy="5650" r="90"/>
    </g>
    <rect x="5800" y="3450" width="400" height="2400" class="fx-f"/>
    <line x1="5800" y1="4650" x2="6200" y2="4650" class="fx"/>

    <!-- リビング：TVボード／チェア／オットマン／ローテーブル／グリーン -->
    <rect x="0" y="6500" width="400" height="1400" class="fx-f"/>
    <rect x="400" y="6850" width="70" height="700" class="fx-f"/>
    <rect x="2500" y="6680" width="720" height="780" rx="70" class="fx-f"/>
    <line x1="3150" y1="6680" x2="3150" y2="7460" class="fx"/>
    <rect x="2560" y="7540" width="600" height="380" rx="60" class="fx-f"/>
    <ellipse cx="1720" cy="7120" rx="520" ry="330" class="fx"/>
    <circle cx="4560" cy="8220" r="270" class="fx"/>
    <circle cx="5180" cy="8300" r="190" class="fx"/>
    <rect x="0" y="7960" width="130" height="820" class="fx-d"/>
    <text class="t note" x="330" y="8460" >エアコン</text>
  </g>

  <!-- ============ 壁 ============ -->
  <g class="wall">
    <!-- 外壁（開口部で分割） -->
    <rect x="-150" y="-150" width="2650" height="150"/>
    <rect x="3400" y="-150" width="2950" height="150"/>
    <rect x="-150" y="8600" width="1550" height="150"/>
    <rect x="4200" y="8600" width="2150" height="150"/>
    <rect x="-150" y="0" width="150" height="2400"/>
    <rect x="-150" y="3400" width="150" height="5200"/>
    <rect x="6200" y="0" width="150" height="8600"/>

    <!-- 間仕切り壁 t=100 -->
    <rect x="2000" y="-150" width="100" height="550"/>
    <rect x="2000" y="1500" width="100" height="450"/>
    <rect x="3600" y="-150" width="100" height="1800"/>
    <rect x="4500" y="-150" width="100" height="2600"/>
    <rect x="4500" y="3150" width="100" height="150"/>
    <rect x="4600" y="1600" width="550" height="100"/>
    <rect x="5850" y="1600" width="350" height="100"/>
    <rect x="3600" y="1650" width="150" height="100"/>
    <rect x="4400" y="1650" width="200" height="100"/>
    <rect x="0" y="1850" width="900" height="100"/>
    <rect x="1900" y="1850" width="200" height="100"/>
    <rect x="4600" y="3200" width="1600" height="100"/>
    <rect x="2700" y="1950" width="100" height="3500"/>
    <rect x="0" y="5450" width="900" height="100"/>
  </g>

  <!-- ============ 建具・開口 ============ -->
  <g>
    <!-- 玄関ドア（外開き） -->
    <path class="swing" d="M3400 -900 A900 900 0 0 0 2500 0"/>
    <line class="leaf" x1="3400" y1="0" x2="3400" y2="-900"/>

    <!-- 洗面脱衣室ドア（内開き） -->
    <path class="swing" d="M5300 2450 A700 700 0 0 1 4600 3150"/>
    <line class="leaf" x1="4600" y1="2450" x2="5300" y2="2450"/>

    <!-- トイレドア（内開き） -->
    <path class="swing" d="M3750 1000 A650 650 0 0 1 4400 1650"/>
    <line class="leaf" x1="3750" y1="1650" x2="3750" y2="1000"/>

    <!-- 浴室 折戸 -->
    <polyline class="leaf" points="5150,1650 5500,1900 5850,1650"/>

    <!-- WIC 引戸（玄関土間側） -->
    <g class="leaf"><line x1="2160" y1="400" x2="2160" y2="1500"/></g>
    <line class="fx" x1="2060" y1="400" x2="2060" y2="1500"/>
    <path class="swing" d="M2280 700 L2280 1200 M2280 700 L2210 790 M2280 700 L2350 790"/>

    <!-- WIC 引戸（寝室側） -->
    <g class="leaf"><line x1="900" y1="2010" x2="1900" y2="2010"/></g>
    <line class="fx" x1="900" y1="1910" x2="1900" y2="1910"/>
    <path class="swing" d="M1150 2140 L1650 2140 M1150 2140 L1240 2070 M1150 2140 L1240 2210"/>

    <!-- 寝室 ⇄ LDK 大開口引戸（2枚引違い） -->
    <g class="leaf">
      <line x1="900" y1="5610" x2="1800" y2="5610"/>
      <line x1="1800" y1="5390" x2="2700" y2="5390"/>
    </g>
    <path class="swing" d="M1250 5760 L2350 5760 M1250 5760 L1340 5690 M1250 5760 L1340 5830
                           M2350 5760 L2260 5690 M2350 5760 L2260 5830"/>

    <!-- 掃き出し窓 -->
    <g class="glass">
      <line x1="1400" y1="8620" x2="4200" y2="8620"/>
      <line x1="1400" y1="8675" x2="4200" y2="8675"/>
      <line x1="1400" y1="8730" x2="4200" y2="8730"/>
    </g>
    <g class="wall">
      <rect x="1400" y="8600" width="60" height="150"/>
      <rect x="4140" y="8600" width="60" height="150"/>
      <rect x="2770" y="8600" width="60" height="150"/>
    </g>

    <!-- 寝室 腰窓 -->
    <g class="glass">
      <line x1="-130" y1="2400" x2="-130" y2="3400"/>
      <line x1="-75" y1="2400" x2="-75" y2="3400"/>
      <line x1="-20" y1="2400" x2="-20" y2="3400"/>
    </g>
    <g class="wall">
      <rect x="-150" y="2400" width="150" height="60"/>
      <rect x="-150" y="3340" width="150" height="60"/>
    </g>
  </g>

  <!-- ============ 撮影位置 ============ -->
  <g id="cams">
    <g class="cam" id="cam1">
      <use href="#viewcone" class="cone" transform="translate(2950,320) rotate(180) scale(1.5)"/>
      <circle cx="2950" cy="320" r="175" class="camdot"/>
      <text class="camnum" x="2950" y="373" text-anchor="middle">1</text>
    </g>
    <g class="cam" id="cam2">
      <use href="#viewcone" class="cone" transform="translate(3300,3520) rotate(178) scale(1.6)"/>
      <circle cx="3300" cy="3520" r="175" class="camdot"/>
      <text class="camnum" x="3300" y="3573" text-anchor="middle">2</text>
    </g>
    <g class="cam" id="cam3">
      <use href="#viewcone" class="cone" transform="translate(1450,5150) rotate(356) scale(1)"/>
      <circle cx="1450" cy="5150" r="175" class="camdot"/>
      <text class="camnum" x="1450" y="5203" text-anchor="middle">3</text>
    </g>
    <g class="cam" id="cam4">
      <use href="#viewcone" class="cone" transform="translate(1800,6200) rotate(0) scale(.95)"/>
      <circle cx="1800" cy="6200" r="175" class="camdot"/>
      <text class="camnum" x="1800" y="6253" text-anchor="middle">4</text>
    </g>
    <g class="cam" id="cam5">
      <use href="#viewcone" class="cone" transform="translate(1830,3620) rotate(333) scale(1.15)"/>
      <circle cx="1830" cy="3620" r="175" class="camdot"/>
      <text class="camnum" x="1830" y="3673" text-anchor="middle">5</text>
    </g>
  </g>

  <!-- ============ 室名 ============ -->
  <g class="t" text-anchor="middle">
    <text class="rname-s" x="1000" y="1180">WIC</text>
    <text class="rsub" x="1000" y="1370">2.3帖</text>

    <text class="rname" x="2850" y="1000">玄関</text>
    <text class="rsub" x="2850" y="1190">土間モルタル</text>

    <text class="rname-s" x="4100" y="1180">トイレ</text>

    <text class="rname-s" x="5400" y="1000">浴室</text>
    <text class="rsub" x="5400" y="1190">1616</text>

    <text class="rname-s" x="5400" y="3050">洗面脱衣</text>

    <text class="rsub" x="3400" y="2980">ホール</text>

    <text class="rname" x="1150" y="2360">寝室 兼</text>
    <text class="rname" x="1150" y="2570">ワークスペース</text>
    <text class="rsub" x="1150" y="2770">5.8帖 ／ モルタル床</text>

    <text class="rname" x="3450" y="6220">LDK</text>
    <text class="rsub" x="3450" y="6420">16.4帖</text>

    <text class="rname-s" x="5470" y="4560">キッチン</text>
    <text class="rsub" x="5470" y="4740">Ⅱ型</text>

    <text class="rname-s" x="3100" y="9450">バルコニー</text>
    <text class="rsub" x="3100" y="9640">奥行 1,350</text>
  </g>

  <!-- 現し・素材の注記 -->
  <g class="t note">
    <text x="170" y="3090">躯体現し壁＋フック</text>
    <text x="1250" y="8200">天井：コンクリート現し／スパイラルダクト</text>
    <text x="1250" y="8360">＋ライティングレール</text>
  </g>

  <!-- ============ 寸法 ============ -->
  <g>
    <!-- 上：間口 -->
    <g class="tick">
      <line x1="0" y1="-1080" x2="0" y2="-1520"/>
      <line x1="2000" y1="-1080" x2="2000" y2="-1220"/>
      <line x1="2100" y1="-1080" x2="2100" y2="-1220"/>
      <line x1="3600" y1="-1080" x2="3600" y2="-1220"/>
      <line x1="3700" y1="-1080" x2="3700" y2="-1220"/>
      <line x1="4500" y1="-1080" x2="4500" y2="-1220"/>
      <line x1="4600" y1="-1080" x2="4600" y2="-1220"/>
      <line x1="6200" y1="-1080" x2="6200" y2="-1520"/>
    </g>
    <line class="dimline" x1="0" y1="-1150" x2="6200" y2="-1150"/>
    <line class="dimline" x1="0" y1="-1450" x2="6200" y2="-1450"/>
    <g class="dimt" text-anchor="middle">
      <text x="1000" y="-1230">2,000</text>
      <text x="2850" y="-1230">1,500</text>
      <text x="4100" y="-1230">800</text>
      <text x="5400" y="-1230">1,600</text>
    </g>
    <text class="dimt-b" x="3100" y="-1530" text-anchor="middle">6,200</text>

    <!-- 左：奥行 -->
    <g class="tick">
      <line x1="-450" y1="0" x2="-950" y2="0"/>
      <line x1="-450" y1="1850" x2="-750" y2="1850"/>
      <line x1="-450" y1="1950" x2="-750" y2="1950"/>
      <line x1="-450" y1="5450" x2="-750" y2="5450"/>
      <line x1="-450" y1="5550" x2="-750" y2="5550"/>
      <line x1="-450" y1="8600" x2="-950" y2="8600"/>
    </g>
    <line class="dimline" x1="-700" y1="0" x2="-700" y2="8600"/>
    <line class="dimline" x1="-950" y1="0" x2="-950" y2="8600"/>
    <g class="dimt" text-anchor="middle">
      <text x="-780" y="925" transform="rotate(-90 -780 925)">1,850</text>
      <text x="-780" y="3700" transform="rotate(-90 -780 3700)">3,500</text>
      <text x="-780" y="7075" transform="rotate(-90 -780 7075)">3,050</text>
    </g>
    <text class="dimt-b" x="-1030" y="4300" text-anchor="middle" transform="rotate(-90 -1030 4300)">8,600</text>

    <!-- 右：水まわり -->
    <g class="tick">
      <line x1="6650" y1="0" x2="6950" y2="0"/>
      <line x1="6650" y1="1600" x2="6950" y2="1600"/>
      <line x1="6650" y1="1700" x2="6950" y2="1700"/>
      <line x1="6650" y1="3200" x2="6950" y2="3200"/>
      <line x1="6650" y1="3300" x2="6950" y2="3300"/>
      <line x1="6650" y1="8600" x2="6950" y2="8600"/>
      <line x1="6650" y1="10100" x2="6950" y2="10100"/>
    </g>
    <line class="dimline" x1="6900" y1="0" x2="6900" y2="10100"/>
    <g class="dimt" text-anchor="middle">
